<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>Remote Desktop Streamer (2D / VR Split)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Container for video displays */
    #display-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      background: #000;
      position: absolute;
      top: 0;
      left: 0;
      cursor: crosshair;
    }

    /* 2D Mode */
    .mode-2d #display-container {
      flex-direction: row;
      align-items: center;
      justify-content: center;
    }
    .mode-2d .video-pane {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .mode-2d #pane-right {
      display: none;
    }
    .mode-2d video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* VR Mode: Pure Side-by-Side (SBS) split */
    .mode-vr #display-container {
      flex-direction: row;
    }
    .mode-vr .video-pane {
      width: 50vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }
    .mode-vr #pane-left {
      border-right: 1px solid rgba(255, 255, 255, 0.2);
    }
    .mode-vr #pane-right {
      border-left: 1px solid rgba(255, 255, 255, 0.2);
    }

    /* Video transforms controlled dynamically via JS sliders */
    .video-wrapper {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      will-change: transform;
      position: relative;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
    }

    /* Virtual Pointer Reticle on Screen */
    .virtual-cursor {
      position: absolute;
      width: 18px;
      height: 18px;
      border: 2px solid #38bdf8;
      background: rgba(56, 189, 248, 0.3);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 50;
      display: none;
      box-shadow: 0 0 8px rgba(56, 189, 248, 0.8);
      transition: width 0.1s, height 0.1s;
    }
    .virtual-cursor::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 4px;
      height: 4px;
      background: #fff;
      border-radius: 50%;
      transform: translate(-50%, -50%);
    }
    .virtual-cursor.clicking {
      width: 26px;
      height: 26px;
      background: rgba(239, 68, 68, 0.5);
      border-color: #ef4444;
    }

    /* Top Floating Controls Bar */
    #top-bar {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 100;
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 6px 14px;
      border-radius: 30px;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      max-width: 95vw;
      overflow-x: auto;
    }
    .btn {
      background: #0284c7;
      color: white;
      border: none;
      padding: 7px 14px;
      font-size: 0.8rem;
      font-weight: 600;
      border-radius: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      transition: background 0.2s;
    }
    .btn:active {
      background: #0369a1;
    }
    .btn-toggle {
      background: #475569;
    }
    .btn-panel {
      background: #334155;
    }
    .status-text {
      color: #94a3b8;
      font-size: 0.8rem;
      white-space: nowrap;
    }

    /* Floating VR Sliders Adjustment Panel */
    #slider-panel {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid rgba(56, 189, 248, 0.4);
      padding: 14px 20px;
      border-radius: 16px;
      z-index: 120;
      backdrop-filter: blur(12px);
      color: #e2e8f0;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.6);
      min-width: 320px;
      opacity: 0.95;
      transition: opacity 0.2s;
    }
    .slider-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .slider-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: #94a3b8;
    }
    .slider-header span.val {
      color: #38bdf8;
      font-weight: bold;
    }
    input[type=range] {
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: #334155;
      outline: none;
      -webkit-appearance: none;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #38bdf8;
      cursor: pointer;
    }

    /* Start / Permission Overlay */
    #start-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(10, 15, 25, 0.96);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 200;
      color: white;
      text-align: center;
      padding: 24px;
    }
    .card {
      background: #1e2430;
      padding: 28px;
      border-radius: 20px;
      max-width: 440px;
      width: 100%;
    }
    h1 {
      font-size: 1.35rem;
      margin-bottom: 12px;
      color: #38bdf8;
    }
    p {
      color: #94a3b8;
      font-size: 0.9rem;
      margin-bottom: 22px;
      line-height: 1.5;
    }
    #big-start-btn {
      width: 100%;
      padding: 16px;
      font-size: 1.05rem;
      background: #10b981;
      border-radius: 12px;
    }
    #log-view {
      margin-top: 15px;
      font-family: monospace;
      font-size: 0.75rem;
      color: #cbd5e1;
      background: #090d16;
      padding: 10px;
      border-radius: 8px;
      text-align: left;
      max-height: 90px;
      overflow-y: auto;
    }
  </style>
</head>
<body class="mode-2d">

  <div id="start-overlay">
    <div class="card">
      <h1>📺 Desktop Streamer</h1>
      <p>Direct low-latency desktop stream with full remote mouse pointer, zoom & eye IPD shift controls.</p>
      <button class="btn" id="big-start-btn">▶ Connect & Start Stream</button>
      <div id="log-view">> Tap button to connect...</div>
    </div>
  </div>

  <div id="top-bar">
    <span class="status-text" id="status-label">⚪ Connecting...</span>
    <button class="btn btn-toggle" id="mode-btn">🥽 Switch to VR Split</button>
    <button class="btn btn-panel" id="tune-btn">⚙️ Adjust VR</button>
    <button class="btn" id="fs-btn">⛶ Fullscreen</button>
  </div>

  <!-- Sliders Adjustment Panel for VR Mode -->
  <div id="slider-panel" style="display: none;">
    <div class="slider-row">
      <div class="slider-header">
        <span>🔍 Zoom Scale</span>
        <span class="val" id="zoom-val">100%</span>
      </div>
      <input type="range" id="zoom-slider" min="0.5" max="2.0" step="0.05" value="1.0">
    </div>

    <div class="slider-row">
      <div class="slider-header">
        <span>↔️ Horizontal Eye Shift (IPD)</span>
        <span class="val" id="ipd-val">0 px</span>
      </div>
      <input type="range" id="ipd-slider" min="-120" max="120" step="2" value="0">
    </div>
  </div>

  <div id="display-container">
    <div class="video-pane" id="pane-left">
      <div class="video-wrapper" id="wrap-left">
        <video id="video-left" playsinline autoplay muted></video>
        <div class="virtual-cursor" id="cursor-left"></div>
      </div>
    </div>
    <div class="video-pane" id="pane-right">
      <div class="video-wrapper" id="wrap-right">
        <video id="video-right" playsinline autoplay muted></video>
        <div class="virtual-cursor" id="cursor-right"></div>
      </div>
    </div>
  </div>

  <script>
    const videoLeft = document.getElementById('video-left');
    const videoRight = document.getElementById('video-right');
    const wrapLeft = document.getElementById('wrap-left');
    const wrapRight = document.getElementById('wrap-right');
    const cursorLeft = document.getElementById('cursor-left');
    const cursorRight = document.getElementById('cursor-right');
    const statusLabel = document.getElementById('status-label');
    const modeBtn = document.getElementById('mode-btn');
    const tuneBtn = document.getElementById('tune-btn');
    const fsBtn = document.getElementById('fs-btn');
    const startOverlay = document.getElementById('start-overlay');
    const bigStartBtn = document.getElementById('big-start-btn');
    const logView = document.getElementById('log-view');
    const sliderPanel = document.getElementById('slider-panel');
    const zoomSlider = document.getElementById('zoom-slider');
    const ipdSlider = document.getElementById('ipd-slider');
    const zoomVal = document.getElementById('zoom-val');
    const ipdVal = document.getElementById('ipd-val');
    const displayContainer = document.getElementById('display-container');

    let isVRMode = false;
    let streamObj = null;
    let pc = null;

    // Adjustable VR parameters
    let currentZoom = 1.0;
    let currentIPDShift = 0; // px shift: positive moves towards each other, negative away

    function applyTransforms() {
      if (isVRMode) {
        // Left eye: shifted right by currentIPDShift
        wrapLeft.style.transform = `scale(${currentZoom * 0.92}) translateX(${currentIPDShift}px)`;
        // Right eye: shifted left by currentIPDShift (moving towards each other)
        wrapRight.style.transform = `scale(${currentZoom * 0.92}) translateX(${-currentIPDShift}px)`;
      } else {
        wrapLeft.style.transform = `scale(${currentZoom})`;
        wrapRight.style.transform = `scale(${currentZoom})`;
      }
    }

    zoomSlider.addEventListener('input', (e) => {
      currentZoom = parseFloat(e.target.value);
      zoomVal.innerText = `${Math.round(currentZoom * 100)}%`;
      applyTransforms();
    });

    ipdSlider.addEventListener('input', (e) => {
      currentIPDShift = parseInt(e.target.value);
      ipdVal.innerText = `${currentIPDShift > 0 ? '+' : ''}${currentIPDShift} px`;
      applyTransforms();
    });

    tuneBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const isVisible = sliderPanel.style.display !== 'none';
      sliderPanel.style.display = isVisible ? 'none' : 'flex';
      tuneBtn.style.background = isVisible ? '#334155' : '#0284c7';
    });

    function log(text) {
      console.log(text);
      logView.innerHTML += "<br/>> " + text;
      logView.scrollTop = logView.scrollHeight;
    }

    // Remote mouse event dispatch to PC backend
    let lastMoveTime = 0;
    function sendMouseInput(action, normX, normY, button = 1) {
      fetch('/input/mouse', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action, x: normX, y: normY, button })
      }).catch(() => {});
    }

    // Update virtual cursor positions on screen
    function updateCursors(normX, normY) {
      const leftRect = wrapLeft.getBoundingClientRect();
      cursorLeft.style.display = 'block';
      cursorLeft.style.left = `${normX * leftRect.width}px`;
      cursorLeft.style.top = `${normY * leftRect.height}px`;

      if (isVRMode) {
        const rightRect = wrapRight.getBoundingClientRect();
        cursorRight.style.display = 'block';
        cursorRight.style.left = `${normX * rightRect.width}px`;
        cursorRight.style.top = `${normY * rightRect.height}px`;
      } else {
        cursorRight.style.display = 'none';
      }
    }

    function handlePointer(e, actionType) {
      let clientX = e.clientX;
      let clientY = e.clientY;
      if (e.touches && e.touches.length > 0) {
        clientX = e.touches[0].clientX;
        clientY = e.touches[0].clientY;
      }

      // Determine active target pane rect
      const targetPane = (!isVRMode || clientX < window.innerWidth / 2) ? wrapLeft : wrapRight;
      const rect = targetPane.getBoundingClientRect();

      let normX = (clientX - rect.left) / rect.width;
      let normY = (clientY - rect.top) / rect.height;

      normX = Math.max(0.0, Math.min(1.0, normX));
      normY = Math.max(0.0, Math.min(1.0, normY));

      updateCursors(normX, normY);

      if (actionType === 'move') {
        const now = Date.now();
        if (now - lastMoveTime > 30) { // Throttle to 30ms for responsiveness
          sendMouseInput('move', normX, normY);
          lastMoveTime = now;
        }
      } else if (actionType === 'down') {
        cursorLeft.classList.add('clicking');
        cursorRight.classList.add('clicking');
        sendMouseInput('move', normX, normY);
        sendMouseInput('down', normX, normY, 1);
      } else if (actionType === 'up') {
        cursorLeft.classList.remove('clicking');
        cursorRight.classList.remove('clicking');
        sendMouseInput('up', normX, normY, 1);
      }
    }

    displayContainer.addEventListener('mousemove', (e) => handlePointer(e, 'move'));
    displayContainer.addEventListener('mousedown', (e) => handlePointer(e, 'down'));
    displayContainer.addEventListener('mouseup', (e) => handlePointer(e, 'up'));

    displayContainer.addEventListener('touchmove', (e) => {
      e.preventDefault();
      handlePointer(e, 'move');
    }, { passive: false });

    displayContainer.addEventListener('touchstart', (e) => {
      handlePointer(e, 'down');
    }, { passive: true });

    displayContainer.addEventListener('touchend', (e) => {
      handlePointer(e, 'up');
    }, { passive: true });

    async function connectWebRTC() {
      try {
        log("Creating RTCPeerConnection...");
        pc = new RTCPeerConnection({
          iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' }
          ]
        });

        pc.ontrack = (event) => {
          log("Track received: " + event.track.kind);
          if (event.track.kind === 'video') {
            streamObj = event.streams[0];
            videoLeft.srcObject = streamObj;
            videoRight.srcObject = streamObj;

            videoLeft.play();
            videoRight.play();

            statusLabel.innerText = "🟢 Connected (30/60 FPS)";
            statusLabel.style.color = "#34d399";
            startOverlay.style.display = "none";
          }
        };

        pc.oniceconnectionstatechange = () => {
          log("ICE State: " + pc.iceConnectionState);
          if (pc.iceConnectionState === 'connected' || pc.iceConnectionState === 'completed') {
            statusLabel.innerText = "🟢 Streaming";
            statusLabel.style.color = "#34d399";
          } else if (pc.iceConnectionState === 'failed') {
            statusLabel.innerText = "❌ ICE Failed";
            statusLabel.style.color = "#f87171";
          }
        };

        pc.addTransceiver('video', { direction: 'recvonly' });

        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        log("Gathering local ICE candidates...");

        await new Promise((resolve) => {
          if (pc.iceGatheringState === 'complete') {
            resolve();
          } else {
            const checkState = () => {
              if (pc.iceGatheringState === 'complete') {
                pc.removeEventListener('icegatheringstatechange', checkState);
                resolve();
              }
            };
            pc.addEventListener('icegatheringstatechange', checkState);
            setTimeout(resolve, 2500);
          }
        });

        log("Sending offer to host...");
        const response = await fetch('/offer', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sdp: pc.localDescription.sdp, type: pc.localDescription.type })
        });

        if (!response.ok) throw new Error("HTTP " + response.status);

        const answer = await response.json();
        log("Setting remote description...");
        await pc.setRemoteDescription(new RTCSessionDescription(answer));
        log("Connected! Starting video playback...");

      } catch (err) {
        log("Error: " + err.message);
        statusLabel.innerText = "❌ " + err.message;
        statusLabel.style.color = "#f87171";
        bigStartBtn.disabled = false;
        bigStartBtn.innerText = "Retry Connection";
      }
    }

    // Toggle 2D / VR Split Mode
    modeBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      isVRMode = !isVRMode;
      if (isVRMode) {
        document.body.className = "mode-vr";
        modeBtn.innerText = "📺 Switch to 2D Mode";
        modeBtn.style.background = "#0284c7";
      } else {
        document.body.className = "mode-2d";
        modeBtn.innerText = "🥽 Switch to VR Split";
        modeBtn.style.background = "#475569";
        sliderPanel.style.display = "none";
      }
      applyTransforms();
    });

    // Fullscreen toggle
    fsBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
        if (screen.orientation && screen.orientation.lock) {
          screen.orientation.lock('landscape').catch(() => {});
        }
      } else {
        document.exitFullscreen().catch(() => {});
      }
    });

    // Start stream
    bigStartBtn.addEventListener('click', async () => {
      bigStartBtn.disabled = true;
      bigStartBtn.innerText = "Connecting to Host...";
      if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen().catch(() => {});
      }
      if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock('landscape').catch(() => {});
      }
      await connectWebRTC();
    });

    // Double tap screen (outside control panels) to toggle 2D / VR
    let lastTap = 0;
    window.addEventListener('touchend', (e) => {
      if (e.target.closest('#top-bar') || e.target.closest('#slider-panel')) return;
      const now = new Date().getTime();
      if (now - lastTap < 350) {
        modeBtn.click();
      }
      lastTap = now;
    });
  </script>
</body>
</html>
